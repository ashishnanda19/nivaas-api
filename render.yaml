# Render blueprint for the API. Database: Neon or Supabase (free tier). Front end: Vercel.
services:
  - type: web
    name: nivaas-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: OTP_FIXED_CODE_ENABLED, value: 'false' }
      # The seeded demo accounts accept the fixed code 123456. Every other number gets a random code.
      - { key: DEMO_OTP_PHONES, value: '9800000001,9800000002,9800000003,9800000004,9800000010,9800000020,9800000030' }
      - { key: STORAGE_DIR, value: /data/storage }
      # The free plan has no persistent disk, so photos are kept in Postgres. Set S3_* instead to use a bucket.
      - { key: STORAGE_DRIVER, value: db }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_REGION, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: S3_FORCE_PATH_STYLE, value: 'true' }
      - { key: DATABASE_URL, sync: false }
      - { key: REDIS_URL, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: PAYMENT_WEBHOOK_SECRET, generateValue: true }
      # Text messages. Leave SMS_PROVIDER as console until Twilio is set up; a real provider needs SMS_ALLOWED_PHONES.
      - { key: SMS_PROVIDER, value: console }
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: TWILIO_FROM, sync: false }
      - { key: SMS_ALLOWED_PHONES, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GEMINI_MODEL, value: gemini-2.5-flash-lite }
      - { key: GROQ_API_KEY, sync: false }
      - { key: GROQ_MODEL, value: openai/gpt-oss-120b }
